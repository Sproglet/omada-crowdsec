services:
  omada-crowdsec:
    image: local/omada-crowdsec:1
    build:
      context: .
    container_name: omada-crowdsec
    restart: unless-stopped
    init: true
    networks:
      - crowdsec
    volumes:
      - ./config:/config:ro
      - ./secrets:/run/secrets:ro
      - ./state:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python3, gateway.py, --health]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  crowdsec:
    name: ${CROWDSEC_NETWORK:-crowdsec_proxy}
    external: true
